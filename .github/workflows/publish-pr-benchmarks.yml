# Posts the benchmark table on the pull request. It runs after the unprivileged "Run benchmarks for PR" workflow
# completes, keeping write permissions out of the pull_request workflow (which also runs PRs from forks). GitHub only
# triggers workflow_run from the copy of this file on the default branch, so comments start once it is merged to main.
name: Publish benchmarks comment to PR

on:
  workflow_run:
    workflows: ["Run benchmarks for PR"]
    types: [completed]

jobs:
  upload-pr-comment:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      issues: write
      pull-requests: write

    steps:
      - name: Download benchmark artifact
        uses: actions/download-artifact@v4
        with:
          name: benchmark-artifacts
          path: benchmark-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Extract PR number
        id: pr-info
        run: |
          pr_number="$(cat benchmark-artifacts/pr)"
          # The artifact comes from PR code: accept only a number.
          [[ "${pr_number}" =~ ^[0-9]+$ ]] || { echo "Invalid PR number: ${pr_number}"; exit 1; }
          printf "pr=%s\n" "${pr_number}" >> "${GITHUB_OUTPUT}"

      - name: Find benchmarks comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ steps.pr-info.outputs.pr }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- lenscluster benchmark -->"

      - name: Create or update benchmarks comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ steps.pr-info.outputs.pr }}
          body-path: benchmark-artifacts/output
          edit-mode: replace
