# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:
    - pandoc                                     # nbsphinx converts the notebooks' Markdown cells with pandoc

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# The Python requirements of the documentation build only (Sphinx, MyST and nbsphinx); the package itself,
# with JAX, is not installed on Read the Docs.
python:
  install:
    - requirements: docs/requirements.txt
