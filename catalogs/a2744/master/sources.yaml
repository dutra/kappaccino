# Papers merged into the Abell 2744 master catalog (scripts/build_master_catalog.py).  Paths are relative to this folder.
cluster: a2744
base: bergamini2023b          # GLASS-JWST, JWST frame, quality flags, core and northern clumps; its systems enter unchanged
members_base: bergamini2023a  # the ApJ 952 member list is not public; the A&A 670 core members (F160W, 202 spectroscopic)
match_radius_arcsec: 0.5      # after each paper is shifted onto the base frame
dz_max: 0.01                  # |dz| / (1 + z) above which two spectroscopic redshifts conflict
z_cluster: 0.308               # members: a spectroscopic z within member_dz (1 + z) of it gives p_member 1
papers:
  bergamini2023b:
    images: ../bergamini2023b/images.yaml
    quality:                  # image notes -> quality (first match wins; 1 otherwise)
      'QF 1': 0.5
      'QP 3': 0.6
      'QF 9': 0.7
      'QF 2': 0.85
  bergamini2023a:
    images: ../bergamini2023a/images.yaml
    quality:                  # image notes -> quality (first match wins; 1 otherwise)
      'QF 1': 0.5
      'QP 3': 0.6
      'QF 9': 0.7
      'QF 2': 0.85
    members: ../bergamini2023a/members.yaml
    derived_from: bergamini2023b   # same team and MUSE data; its 90 images are the 'd' rows of bergamini2023b
    prefix: BA
  furtak2023:
    images: ../furtak2023/images.yaml
    members: ../furtak2023/members.yaml
    derived_from: bergamini2023b   # core images compiled from Bergamini et al. (release README); positions identical to bergamini2023a
    prefix: F
  mahler2018:
    images: ../mahler2018/images.yaml
    quality:                  # image notes -> quality (first match wins; 1 otherwise)
      'categories c': 0.3
      'categories bc': 0.5
      'categories sbc': 0.7
    prefix: M
