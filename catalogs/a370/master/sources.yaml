# Papers merged into the Abell 370 master catalog (scripts/build_master_catalog.py).  Paths are relative to this folder.
cluster: a370
base: gledhill2024            # CANUCS (JWST frame, knots, new spectroscopic z for systems 8 and 11); its systems enter unchanged
match_radius_arcsec: 0.5      # after each paper is shifted onto the base frame
dz_max: 0.01                  # |dz| / (1 + z) above which two spectroscopic redshifts conflict
z_cluster: 0.375               # members: a spectroscopic z within member_dz (1 + z) of it gives p_member 1
papers:
  gledhill2024:
    images: ../gledhill2024/images.yaml
    members: ../gledhill2024/members.yaml
    # z_kind left unknown: the multim header gives spectroscopic z for systems 1-4 and 6, the rest from Diego / Strait
  lagattuta2019:
    images: ../lagattuta2019/images.yaml
    quality:                  # image notes -> quality (first match wins; 1 otherwise)
      'note 1': 0.3
      'class copper': 0.3
      'class -': 0.3
      'class bronze': 0.5
      'class silver': 0.7
    members: ../lagattuta2019/members.yaml
    prefix: L
