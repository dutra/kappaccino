# How MACS J0416 is fitted with the HST + MUSE catalog of Bergamini et al. 2023.
# xonsh run.xsh catalogs/m0416/bergamini2023 [--profile fast] [--profile jwst]
name: m0416_bergamini2023
priors: priors.yaml

runtime: {seed: 12345, chains: 4, resume: true, numpyro_print_summary: true, nuts_chain_method: parallel}

likelihood:
  # The GRF of unmodelled mass with a knee spectrum plus the image-plane GP; see catalogs/hera/run.yaml for the priors.
  # Under the knee kernel the fold-pair depth error is the common-mode deflection error, so the default 1.5 mas floor
  # applies (the image-plane GP alone needed gp_floor_arcsec 0.0005 here).
  likelihood_mode: gp_image_plane
  gp_kernel: knee
  sigma_sel_prior: null
  gp_blocks: all
  gp_knee_project_modes: [translation, convergence, shear]
  gp_knee_gamma: 4.0
  gp_knee_gamma_prior: null
  gp_knee_scales_arcsec: [0.2, 100.0]
  lambda_b_prior: lognormal(20.0, 1.0) in [0.5, 80.0]
  lambda_b_start_arcsec: 20.0
  sigma_grf_prior: lognormal(0.08, 0.5) in [1.0e-4, 0.5]
  sigma_grf_start_arcsec: 0.08
  gp_knee_ell_gp_prior: lognormal(1.0, 0.4) in [0.4, 3.0]
  gp_knee_ell_gp_start_arcsec: 1.0

search: {n_starts: 256, halo_method: lbfgs, member_method: lbfgs}
sampling: {warmup: 500, samples: 250, max_tree_depth: 7, target_accept: 0.8}

# Classified at the current model.  The far-field error at 2 r_cut is < 1 uas (oct28a); the default inflation 3 keeps
# the headroom.
members: {centering: auto, far_field_cut_radii: 2.0, classification_prior_quantile: null}

reporting: {draws: 64, image_draws: 64, extra_images: true}

image_catalog:
  image_dir: ../../../data/imaging/m0416/buffalo
  image_scale: auto
  bands: [F435W, F606W, F814W, F105W, F125W, F140W, F160W]
  # Standalone paper figures, one panel per selector in this order: image:K34.b is one image, family:K6A that knot's
  # images, system:K6 every knot in the saved fold cutout.
  paper_small_lambda_cutouts: ["image:K34.b", "image:K34.a", "image:K33.e", "image:K77.b"]
  paper_fold_cutouts: ["system:K1", "system:K6", "system:K8", "system:K12"]

profiles:
  fast:
    likelihood: {gp_blocks: system, gp_knee_project_modes: []}
    sampling: {max_tree_depth: 8}
    members: {far_field_cut_radii: 2.0, classification_prior_quantile: null, min_deflection_arcsec: null, cut_radius_inflation: 3.0}
    scaling: {member_shape_scatter: null}
    image_diagnostics: {fold_pair_max_separation_arcsec: 3.0}
    reporting: {draws: 8, image_draws: 8, extra_images: false}
  # Figures on the CANUCS DR1 NIRCam mosaics.
  jwst:
    image_catalog:
      image_dir: ../../../data/imaging/m0416/canucs_dr1
      bands: [F115W, F150W, F200W, F444W]
      figure_suffix: _jwst
