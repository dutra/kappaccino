# Papers merged into the MACS J1149 master catalog (scripts/build_master_catalog.py).  Paths are relative to this folder.
cluster: m1149
base: treu2016                # the community list of the Refsdal comparison (Treu et al. 2016), with the host knots
members_base: grillo2016      # Table 6: F160W, spectroscopic members flagged, the BCG named
match_radius_arcsec: 0.5      # after each paper is shifted onto the base frame
dz_max: 0.01                  # |dz| / (1 + z) above which two spectroscopic redshifts conflict
z_cluster: 0.542              # members: a spectroscopic z within member_dz (1 + z) of it gives p_member 1
papers:
  treu2016:
    images: ../treu2016/images.yaml
    quality:                  # image notes -> quality (first match wins; 1 otherwise)
      'set Rejected': 0.1
      'set -': 0.4
      'set Silver': 0.7
  grillo2016:
    images: ../grillo2016/images.yaml
    members: ../grillo2016/members.yaml
    derived_from: treu2016    # its images are T16 systems of the same compilation
    prefix: G
  canucs:
    members: ../canucs/members.yaml   # members only: the CANUCS image catalog of MACS J1149 is not released (v2)
    prefix: C
